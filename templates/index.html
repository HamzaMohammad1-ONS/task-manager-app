<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Task Management</h1>
    <form id="task-form">
        <input type="text" id="task-title" placeholder="Task Title" required>
        <textarea id="task-description" placeholder="Task Description"></textarea>
        <button type="submit">Add Task</button>
    </form>

    <h2>Task List</h2>
    <ul id="task-list">
        {% for task in tasks %}
        <li>
            <span><strong>Title:</strong> {{ task.title }}</span><br>
            <span><strong>Description:</strong> {{ task.description }}</span><br>
            <span><strong>Priority:</strong> {{ task.priority }}</span>
            <button onclick="editTask({{ task.id }})">Edit</button>
            <button onclick="deleteTask({{ task.id }})">Delete</button>
        </li>
        {% endfor %}
    </ul> 
    
    <script>
        // ((add functionality to interact with the API))
        document.getElementById('task-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const title = document.getElementById('task-title').value;
            const description = document.getElementById('task-description').value;

            fetch('/api/tasks', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ title, description })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Task created:', data);
                window.location.reload();
            });
        });

        function deleteTask(id) {
            fetch(`/api/tasks/${id}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                console.log('Task deleted:', data);
                window.location.reload();
            });
        }

        function editTask(id) {
            // ((implement task editing functionality here))
        }
    </script>
</body>
</html>
